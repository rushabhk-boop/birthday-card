<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Make a Birthday Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Pinyon+Script&family=Special+Elite&display=swap">
<style>
/* Layout: one narrow kraft sheet holding the form, then the finished link. */
:root {
  --satin: #f4ece2; --ink: #2a1c12; --ink-soft: #6a5241; --kraft: #b98c5c; --kraft-light: #d2aa7c;
  --parchment: #f0d7a1; --paper: #fbf6ee; --ribbon: #8e1c26;
  --f-script: "Pinyon Script", "Snell Roundhand", cursive; --f-hand: "Kalam", "Segoe Print", cursive; --f-type: "Special Elite", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--satin); color: var(--ink); font-family: var(--f-hand); font-size: 17px;
  padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}
main { width: min(520px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--f-script); font-weight: 400; font-size: clamp(48px, 10vw, 66px); line-height: 1; margin: 0; text-align: center; }
.lede { margin: 0; text-align: center; color: var(--ink-soft); }
form, .result { background: var(--parchment); padding: 26px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 0 26px 4px rgba(154, 102, 48, .45); }
label { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-type); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
label small { text-transform: none; letter-spacing: 0; font-family: var(--f-hand); font-size: 14px; color: var(--ink-soft); }
input, textarea { font: inherit; font-family: var(--f-hand); font-size: 17px; text-transform: none; letter-spacing: 0; padding: 10px 12px; border: 1.5px solid var(--kraft); background: var(--paper); color: var(--ink); border-radius: 3px; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px dashed var(--ribbon); outline-offset: 3px; }
button, .btn { font-family: var(--f-type); font-size: 13px; letter-spacing: .08em; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--ribbon); color: var(--paper); cursor: pointer; text-decoration: none; text-align: center; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.link { font-family: var(--f-type); font-size: 13px; word-break: break-all; background: var(--paper); padding: 12px; border: 1.5px dashed var(--kraft); user-select: all; }
.note { font-size: 14px; color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Make her card</h1>
  <p class="lede">Fill this in and you get a private link to send. Nothing is saved anywhere: every detail lives inside the link itself.</p>
  <form id="f">
    <label for="to">Her name<input id="to" required maxlength="40" placeholder="Priya"></label>
    <label for="born">Date of birth<small>With the year, so the card can show the moon on the night she was born, count her candles and lock until the day.</small><input id="born" type="date"></label>
    <label for="from">Your name<input id="from" maxlength="40" placeholder="Rushabh"></label>
    <label for="msg">Your message<small>Leave it empty to use the card's own message.</small><textarea id="msg" maxlength="400"></textarea></label>
    <button type="submit">Create the link</button>
  </form>
  <section class="result" id="result" hidden>
    <label>Her link</label>
    <div class="link" id="link"></div>
    <div class="row">
      <button id="copy">Copy link</button>
      <a class="btn ghost" id="open" target="_blank" rel="noopener">Preview it</a>
    </div>
    <p class="note">If you set a date of birth in the future this year, she sees a countdown until midnight on her birthday. In the preview, use "Open it anyway".</p>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const p = new URLSearchParams();
  [["to", "#to"], ["born", "#born"], ["from", "#from"], ["msg", "#msg"]].forEach(([k, sel]) => { const v = $(sel).value.trim(); if (v) p.set(k, v); });
  const url = new URL("./", location.href).href + "#" + p.toString();
  $("#link").textContent = url; $("#open").href = url; $("#result").hidden = false;
  $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
});
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#link").textContent); $("#copy").textContent = "Copied"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#link")); getSelection().removeAllRanges(); getSelection().addRange(r); $("#copy").textContent = "Press Ctrl+C or Cmd+C"; }
  setTimeout(() => { $("#copy").textContent = "Copy link"; }, 2200);
});
</script>
</body>
</html>
